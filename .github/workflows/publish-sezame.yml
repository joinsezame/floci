name: Publish Sezame image

# JVM image for the Sezame emulator (container name sezame-floci).
# This is not the GraalVM native image that upstream publishes to Docker Hub.
#
# Consumers pin ghcr.io/joinsezame/floci:<version>-sezame.<n>-jvm
# (joinsezame/conduit, packages/cdk-effect). The tag without -jvm is the same image.
#
# Triggers:
#   push to main
#     ghcr.io/joinsezame/floci:main
#     ghcr.io/joinsezame/floci:main-jvm
#     ghcr.io/joinsezame/floci:<commit>
#     ghcr.io/joinsezame/floci:<commit>-jvm
#   push of a git tag <major>.<minor>.<patch>-sezame.<n>, or a manual run with that tag
#     ghcr.io/joinsezame/floci:<tag>
#     ghcr.io/joinsezame/floci:<tag>-jvm
#     plus the commit tags above
#
# :main moves on every push to main. A numbered -sezame tag moves only when that
# tag is pushed or chosen in a manual run. latest is not published.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to publish, without -jvm. main, or a pin such as 2.3.0-sezame.3
        required: true
        default: main
        type: string
  push:
    branches:
      - main
    tags:
      # <major>.<minor>.<patch>-sezame.<n>, for example 2.3.0-sezame.3. No v prefix.
      - "[0-9]+.[0-9]+.[0-9]+-sezame.[0-9]+"

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-sezame-${{ github.event_name }}-${{ github.ref }}-${{ inputs.tag }}
  # A newer main push replaces an older one. A numbered pin is left to finish.
  cancel-in-progress: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

jobs:
  publish:
    name: Build and push JVM image
    if: github.repository == 'joinsezame/floci'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "25"

      # Restore only. CI on main owns saving this cache (see ci.yml).
      - name: Restore Maven cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/repository
          key: maven-${{ runner.os }}-${{ hashFiles('pom.xml') }}
          restore-keys: |
            maven-${{ runner.os }}-

      - name: Package
        run: ./mvnw -B package -DskipTests

      # docker/Dockerfile.jvm-package copies target/quarkus-app. The repository
      # .dockerignore keeps only one level of that tree, so the fast-jar lib and
      # app directories would be missing. Stage a context that contains the tree.
      - name: Stage image context
        shell: bash
        run: |
          set -euo pipefail
          context="target/image-context"
          rm -rf "$context"
          mkdir -p "$context/target" "$context/docker"
          cp -a target/quarkus-app "$context/target/quarkus-app"
          cp docker/entrypoint.sh docker/healthcheck.sh "$context/docker/"
          printf '%s\n' '# Staged context. Keep every file copied in above.' > "$context/.dockerignore"
          test -f "$context/target/quarkus-app/quarkus-run.jar"
          test -d "$context/target/quarkus-app/lib"
          test -d "$context/target/quarkus-app/app"
          echo "quarkus-app $(du -sh "$context/target/quarkus-app" | awk '{print $1}')"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Resolve tags
        id: tags
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          image="ghcr.io/joinsezame/floci"
          short="${SHA:0:12}"

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            # The ref chosen in the Actions UI is what gets built. A pin cut from
            # another branch would publish that branch under a mainline tag.
            if [[ "$REF" != "refs/heads/main" ]]; then
              echo "::error::Manual publish runs from refs/heads/main so the image matches main. This ref is ${REF}."
              exit 1
            fi
            base="$INPUT_TAG"
          elif [[ "$REF_TYPE" == "tag" ]]; then
            base="$REF_NAME"
          else
            base="main"
          fi

          if [[ -z "$base" ]]; then
            echo "::error::Image tag is empty."
            exit 1
          fi
          if [[ "$base" == *-jvm ]]; then
            echo "::error::Do not include the -jvm suffix. Publishing ${base%-jvm} also pushes ${base}."
            exit 1
          fi
          if [[ "$base" == "main" ]]; then
            if [[ "$REF" != "refs/heads/main" ]]; then
              echo "::error::The main tag is published only from refs/heads/main (this ref is ${REF})."
              exit 1
            fi
          elif [[ ! "$base" =~ ^[0-9]+\.[0-9]+\.[0-9]+-sezame\.[0-9]+$ ]]; then
            echo "::error::Tag must be main or <major>.<minor>.<patch>-sezame.<n>, for example 2.3.0-sezame.3. Got: ${base}"
            exit 1
          fi

          tags="${image}:${base}"$'\n'"${image}:${base}-jvm"
          if [[ "$short" != "$base" ]]; then
            tags="${tags}"$'\n'"${image}:${short}"$'\n'"${image}:${short}-jvm"
          fi

          {
            echo "base=${base}"
            echo "short=${short}"
            echo "tags<<EOF"
            printf '%s\n' "$tags"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ github.workspace }}/target/image-context
          file: ${{ github.workspace }}/docker/Dockerfile.jvm-package
          platforms: linux/amd64
          push: true
          # A single-platform image, not an attestation index.
          provenance: false
          sbom: false
          build-args: |
            VERSION=${{ steps.tags.outputs.base }}
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.title=floci
            org.opencontainers.image.description=Sezame JVM build of Floci
            org.opencontainers.image.source=https://github.com/joinsezame/floci
            org.opencontainers.image.url=https://github.com/joinsezame/floci
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.tags.outputs.base }}
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha,scope=sezame-jvm
          cache-to: type=gha,scope=sezame-jvm,mode=max,ignore-error=true

      - name: Record published tags
        shell: bash
        env:
          IMAGE: ghcr.io/joinsezame/floci
          TAGS: ${{ steps.tags.outputs.tags }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          {
            echo "## Sezame Floci image"
            echo
            echo "Same JVM image, linux/amd64:"
            echo
            while IFS= read -r tag; do
              [[ -z "$tag" ]] && continue
              echo "- \`${tag}\`"
            done <<< "$TAGS"
            echo
            echo "Digest: \`${IMAGE}@${DIGEST}\`"
          } >> "$GITHUB_STEP_SUMMARY"
